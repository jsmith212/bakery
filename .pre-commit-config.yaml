# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # The OCI testdata is captured wire bytes whose sha256 is asserted verbatim
      # (see testIndexDigest); a "fixed" trailing newline changes the digest.
      - id: trailing-whitespace
        exclude: ^((internal/cache/oci|test/oci)/testdata/|docs/deploy/schemas/)
      - id: end-of-file-fixer
        exclude: ^((internal/cache/oci|test/oci)/testdata/|docs/deploy/schemas/)
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
