# Commit-message linting (the pre-commit hooks) and the release version math
# (.github/workflows/release.yml) both read this file, so the tool that ENFORCES
# the conventional-commit format is the same one that INTERPRETS it for bumps.
#
# Releases are TAG-ONLY. The release workflow computes the next version with
# `cz bump --yes --get-next` and pushes an annotated tag; nothing is ever
# committed back to main, and the changelog lives on the GitHub Release
# (generated by `cz changelog <tag> --dry-run`), not in the repo. That is why
# `version_provider = "scm"` (the current version IS the latest git tag) and why
# there is no static `version =` key -- one would go stale on the first release.
#
# Do NOT run a plain `cz bump` here: with the scm provider and no version files
# it has nothing to commit and fails AFTER computing the version, without
# creating the tag (verified empirically against commitizen 4.8.3).
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
# Pre-1.0: a BREAKING CHANGE bumps the minor, not the major. Remove this when
# the config surface is declared stable and 1.0 is cut deliberately.
major_version_zero = true
