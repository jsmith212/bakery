# EXAMPLE ONLY -- do not apply this file as-is; it exists to document the one
# key deployment.yaml reads via secretKeyRef. Generate the real Secret with
# `kubectl create secret generic bakery-db --from-literal=DB_URL=...` or your
# cluster's secret manager (external-secrets, Sealed Secrets, etc).
#
# DB_URL has no default (internal/config/config.go) -- it is a required flag,
# and Boot fails fast without it. There is nowhere else Bakery reads database
# credentials from: no extensions, no plaintext-in-DB, standard driver DSN
# only.
apiVersion: v1
kind: Secret
metadata:
  name: bakery-db
  labels:
    app.kubernetes.io/name: bakery
type: Opaque
stringData:
  DB_URL: "postgres://bakery:CHANGE_ME@postgres.example.internal:5432/bakery?sslmode=require"
